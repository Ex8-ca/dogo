#
# Dogo's own CI. The inherited Lawnchair workflows only run on *-dev branches
# and gate their publishing steps on the LawnchairLauncher org, so they never
# exercise the dogo channel.
name: Dogo CI

on:
  push:
    branches:
      - 'dogo/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - 'dogo/**'
  workflow_dispatch:

concurrency:
  group: dogo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Formatting (spotless)
        run: ./gradlew spotlessCheck

      - name: Unit tests (dogo channel)
        run: ./gradlew :testLawnWithQuickstepDogoDebugUnitTest

      - name: Build debug APK (dogo channel)
        run: ./gradlew assembleLawnWithQuickstepDogoDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dogo-test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dogo-debug-apk
          path: build/outputs/apk/lawnWithQuickstepDogo/debug/*.apk
