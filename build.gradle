final def buildCommit = providers.exec {
    commandLine('git', 'rev-parse', '--short=7', 'HEAD')
}.standardOutput.asText.get().trim()

final def ciBuild = System.getenv("CI") == "true"
final def ciRef = System.getenv("GITHUB_REF") ?: ""
final def ciRunNumber = System.getenv("GITHUB_RUN_NUMBER") ?: ""
final def isReleaseBuild = ciBuild
        && (ciRef.endsWith("-alpha")
        || ciRef.endsWith("-beta")
        || ciRef.endsWith("-rc")
        || ciRef.endsWith("-stable"))
final def devReleaseName = ciBuild ? "Dev.(#${ciRunNumber})" : "Dev.(${buildCommit})"

final def version = "16"
final def releaseName = "Beta 1"
final def versionDisplayName = "${version}.${isReleaseBuild ? releaseName : devReleaseName}"
final def majorVersion = versionDisplayName.split("\\.")[0]

final def quickstepMinSdk = "35"
final def quickstepMaxSdk = "36"

android {
    namespace "com.android.launcher3"
    defaultConfig {
        /*
         * Lawnchair Launcher 16.0 Beta 1.0
         * see https://docs.lawnchair.app/developers/standards/development-workflow#versioning-scheme
         */
        versionCode 16_00_02_01_00
        versionName "${versionDisplayName}"
        buildConfigField "String", "VERSION_DISPLAY_NAME", "\"${versionDisplayName}\""
        buildConfigField "String", "MAJOR_VERSION", "\"${majorVersion}\""
        buildConfigField "String", "COMMIT_HASH", "\"${buildCommit}\""
        buildConfigField "boolean", "ENABLE_AUTO_INSTALLS_LAYOUT", "false"

        manifestPlaceholders.quickstepMinSdk = quickstepMinSdk
        manifestPlaceholders.quickstepMaxSdk = quickstepMaxSdk
        buildConfigField "int", "QUICKSTEP_MIN_SDK", quickstepMinSdk
        buildConfigField "int", "QUICKSTEP_MAX_SDK", quickstepMaxSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    androidResources {
        generateLocaleConfig true
    }

    buildFeatures {
        aidl true
        buildConfig true
        resValues true
    }

    packagingOptions.resources.excludes += [
        "**/*.proto",
        "**/*.bin",
        "**/*.java",
        "**/*.properties",
        "**/*.version",
        "**/*.*_module",
        "com/**",
        "google/**",
        "kotlin/**",
        "kotlinx/**",
        "okhttp3/**",
        "META-INF/services/**",
        "META-INF/com/**",
        "META-INF/licenses/**",
        "META-INF/AL2.0",
        "META-INF/LGPL2.1",
    ]

    // Load all proguard configs from AOSP
    def proguardFilesFromAosp = allprojects.collect { proj ->
        [
            'proguard.flags',
            'proguard_flags.flags',
            'proguard_plugins.flags'
        ].collect { proj.file(it) }
    }.flatten().findAll { it.exists() }.toArray()

    def releaseSigning
    try {
        def keystoreProperties = new Properties()
        keystoreProperties.load(rootProject.file("keystore.properties").newInputStream())
        releaseSigning = signingConfigs.create("release") {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile rootProject.file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    } catch (Exception ignored) {
        releaseSigning = signingConfigs.debug
    }

    buildTypes {
        all {
            signingConfig releaseSigning
            pseudoLocalesEnabled true
        }

        debug {
            applicationIdSuffix ".debug"

            manifestPlaceholders.quickstepMinSdk = "0"
            manifestPlaceholders.quickstepMaxSdk = "100000"
            buildConfigField "int", "QUICKSTEP_MIN_SDK", "0"
            buildConfigField "int", "QUICKSTEP_MAX_SDK", "100000"
        }

        release {
            minifyEnabled true
            shrinkResources true
            pseudoLocalesEnabled false
            proguardFiles proguardFilesFromAosp + "proguard.pro"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
    }

    testOptions {
        unitTests {
            // Dogo: unit tests need real merged resources/manifest (Robolectric,
            // and any test that reads R.string / R.id).
            // NOTE: this is a Groovy build script, so the property is spelled
            // `includeAndroidResources` — the `isIncludeAndroidResources`
            // spelling used in build.gradle.kts modules does not resolve here.
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // See: https://developer.android.com/studio/build/build-variants#flavor-dimensions
    flavorDimensions += ["app", "recents", "channel"]

    productFlavors {
        lawn {
            dimension "app"
        }

        withQuickstep {
            dimension "recents"
            minSdk = 26
        }

        github {
            applicationId 'app.lawnchair'
            dimension "channel"
            // The About screen checks the upstream LawnchairLauncher/lawnchair
            // releases and renders their commit messages as the changelog.
            buildConfigField "boolean", "SHOW_UPSTREAM_UPDATE_CHECK", "true"
        }

        nightly {
            applicationId 'app.lawnchair.nightly'
            dimension "channel"
            buildConfigField "boolean", "SHOW_UPSTREAM_UPDATE_CHECK", "true"
        }

        play {
            applicationId "app.lawnchair.play"
            dimension "channel"
            isDefault true
            buildConfigField "boolean", "SHOW_UPSTREAM_UPDATE_CHECK", "true"
        }

        // Dogo's own distribution channel. Distinct applicationId so Dogo
        // installs side-by-side with an upstream Lawnchair build, which matters
        // when testing against the launcher this is forked from.
        dogo {
            applicationId 'app.dogo.launcher'
            dimension "channel"
            // Off: the update check reads the *upstream* Lawnchair releases from
            // GitHub and shows their commit messages ("a first look at Lawnchair
            // 16"), which is both wrong branding and a wrong update target for a
            // fork. It is network-fetched, so no resource override can hide it.
            buildConfigField "boolean", "SHOW_UPSTREAM_UPDATE_CHECK", "false"
        }

        configureEach {
            // launcher_component used to be emitted here, but ${applicationId}
            // is not resolved yet while flavors are being configured, so every
            // channel got the literal "null/app.lawnchair.LawnchairLauncher".
            // It is emitted per variant from variant.applicationId instead.
        }
    }

    sourceSets {
        main {
            res.srcDirs = ['res']

            // Lawnchair-TODO: Don't include Compose Disabled, but there's has to be another way of making this NOT long
            java.srcDirs = ['src', 'src_plugins', 'compose/facade/core', 'compose/facade/enabled', 'compose/features', 'dogo/src']
            kotlin.directories.addAll('src', 'src_plugins', 'compose/facade/core', 'compose/facade/enabled', 'compose/features', 'dogo/src')

            manifest.srcFile 'AndroidManifest-common.xml'
            proto {
                srcDirs = ['protos/', 'quickstep/protos_overrides/']
            }
        }

        lawn {
            java.srcDirs = ['src_flags', 'src_shortcuts_overrides', 'lawnchair/src', 'tests/shared']
            kotlin.directories.addAll('src_flags', 'src_shortcuts_overrides', 'lawnchair/src', 'tests/shared')
            aidl.srcDirs = ['lawnchair/aidl']
            res.srcDirs = ['lawnchair/res', 'platform_frameworks_libs_systemui/animationlib/res']
            manifest.srcFile "lawnchair/AndroidManifest.xml"
            assets {
                srcDirs 'lawnchair/assets'
            }
            proto {
                srcDirs = ['lawnchair/protos/']
            }
        }

        github {
            manifest.srcFile "github/AndroidManifest.xml"
        }

        nightly {
            manifest.srcFile "nightly/AndroidManifest.xml"
            res.srcDirs = ["nightly/res"]
        }

        lawnWithQuickstepGithub {
            manifest.srcFile "quickstep/AndroidManifest-launcher.xml"
        }

        lawnWithQuickstepNightly {
            manifest.srcFile "quickstep/AndroidManifest-launcher.xml"
        }

        lawnWithQuickstepPlay {
            manifest.srcFile "quickstep/AndroidManifest-launcher.xml"
        }

        // Same launcher-shaped manifest as the other shipping channels: the
        // plain quickstep manifest pulls in Smartspacer, which declares
        // minSdk 29 and fails the merge against this project's minSdk 26.
        lawnWithQuickstepDogo {
            manifest.srcFile "quickstep/AndroidManifest-launcher.xml"
            // Dogo-branded string overrides (see dogo/res/values/strings_dogo.xml).
            // These live on the combined variant source set, not the `dogo`
            // flavor: the `app` dimension (lawn) outranks `channel` for
            // resource conflicts, so a flavor-level override is merged but
            // then loses to lawnchair/res/values/strings.xml.
            res.srcDir 'dogo/res'
        }

        // Dogo channel manifest additions (network security config), merged
        // on top of the launcher manifest for dogo builds only.
        dogo {
            manifest.srcFile "dogo/AndroidManifest.xml"
        }

        withQuickstep {
            res.srcDirs = ['quickstep/res', 'quickstep/recents_ui_overrides/res']
            java.srcDirs = ['quickstep/src', 'quickstep/dagger', 'quickstep/recents_ui_overrides/src', 'quickstep/src_protolog']
            kotlin.directories.addAll('quickstep/src', 'quickstep/dagger', 'quickstep/recents_ui_overrides/src', 'quickstep/src_protolog')
            manifest.srcFile "quickstep/AndroidManifest.xml"
        }

        // Dogo: JVM unit tests. Deliberately NOT `src/test/java` — the main
        // source set above uses the whole `src` directory as a source root, so a
        // nested `src/test` would be swept into the production compilation.
        test {
            java.srcDirs = ['dogo/tests']
            kotlin.directories.addAll('dogo/tests')
            resources.srcDirs = ['dogo/tests/resources']
        }

        // Dogo: on-device instrumentation tests.
        androidTest {
            java.srcDirs = ['dogo/androidTest']
            kotlin.directories.addAll('dogo/androidTest')
            resources.srcDirs = ['dogo/androidTest/resources']
        }
    }
}

// Emits the per-variant strings that used to be buildType/flavor resValues.
abstract class GenerateAppNameRes extends DefaultTask {

    @Input
    abstract Property<String> getAppName()

    @Input
    abstract Property<String> getLauncherComponent()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generate() {
        def valuesDir = new File(outputDirectory.get().asFile, "values")
        valuesDir.mkdirs()
        new File(valuesDir, "dogo_app_name.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="derived_app_name" translatable="false">${appName.get()}</string>
    <string name="launcher_component" translatable="false">${launcherComponent.get()}</string>
</resources>
"""
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def channel = variant.productFlavors.last().second
        variant.outputs.forEach { output ->
            // The Dogo channel is no longer a Lawnchair build, so don't stamp
            // its brand onto the APK filename either.
            def brand = (channel == "dogo") ? "Dogo" : "Lawnchair"
            output.outputFileName.set("${brand}.${output.versionName.get()}.$channel.${variant.buildType}.apk")
        }

        // `derived_app_name` is the app label. It used to be a buildType
        // resValue, but AGP gives buildType resValues precedence over flavor
        // ones, so a per-channel resValue was silently ignored. Emitting it per
        // variant instead keeps the upstream channel names byte-identical while
        // letting Dogo actually brand itself.
        def isDogoChannel = (channel == "dogo")
        def appName = isDogoChannel ? "Dogo Phone"
                : (variant.buildType == "debug" ? "Lawnchair (Debug)" : "Lawnchair")
        def capitalizedVariantName = variant.name.substring(0, 1).toUpperCase(java.util.Locale.ROOT) + variant.name.substring(1)
        def generateAppName = tasks.register("generate${capitalizedVariantName}AppName", GenerateAppNameRes) {
            it.appName.set(appName)
            // variant.applicationId is fully merged here (flavor id + buildType
            // suffix), unlike the flavor-scoped applicationId.
            it.launcherComponent.set("${variant.applicationId.get()}/app.lawnchair.LawnchairLauncher")
            it.outputDirectory.set(layout.buildDirectory.dir("generated/dogoRes/${variant.name}"))
        }
        variant.sources.res.addGeneratedSourceDirectory(generateAppName) { it.outputDirectory }

        // Lawnchair-TODO: A better way to sync proto file to the IDE preventing missing or outdated result. Please remove if this is the best solution we have right now
        def generatedProtoJavaDir = layout.buildDirectory
            .dir("generated/java/generate${capitalizedVariantName}Proto/java")
            .get()
            .asFile
        variant.sources.java.addStaticSourceDirectory(generatedProtoJavaDir.absolutePath)
    }
}

